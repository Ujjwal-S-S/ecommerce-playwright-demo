name: CI & Smart Regression Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-and-build:
    name: Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ujjwal-s-s'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test:unit

      - name: Build React Application
        run: npm run build

  smart-regression-e2e:
    name: AI Impact Selection & E2E Run
    needs: unit-tests-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: read

    steps:
      - name: Checkout code (full depth for git diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ujjwal-s-s'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run AI Smart Regression Analysis & PR Comment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm exec smart-test comment --base "origin/${{ github.base_ref || 'main' }}" || npm exec smart-test analyze --base "origin/${{ github.base_ref || 'main' }}"

      - name: Execute Targeted Playwright Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm exec smart-test run --base "origin/${{ github.base_ref || 'main' }}"
