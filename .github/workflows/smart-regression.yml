name: CI & Smart Regression Suite

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  unit-tests-and-build:
    name: Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test:unit

      - name: Build React Application
        run: npm run build

  smart-regression-e2e:
    name: AI Impact Selection & E2E Run
    needs: unit-tests-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code (full depth for git diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Smart Regression Agent CLI
        run: npm install -g https://github.com/Ujjwal-S-S/smart-regression-agent.git

      - name: Run AI Smart Regression Analysis & PR Comment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          smart-test comment --base "origin/${{ github.base_ref || 'main' }}" || smart-test analyze --base "origin/${{ github.base_ref || 'main' }}"

      - name: Execute Targeted Playwright Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          smart-test run --base "origin/${{ github.base_ref || 'main' }}"
